# FCC Monitor Configuration (Updated)

# Target companies to monitor (Grantee Codes)
target_grantees:
  - name: "Zebra"
    codes: ["UZ7"]
  - name: "Honeywell"
    codes: ["HD5"]
  - name: "Datalogic"
    codes: ["U4F", "U4G"]
  - name: "Point Mobile"
    codes: ["V2X"]
  - name: "Bluebird"
    codes: ["SS4"]
  - name: "Unitech"
    codes: ["HLE"]
  - name: "Proglove"
    codes: ["2AOJL"]
  - name: "Chainway"
    codes: ["2AC6A"]
  - name: "Fujian Newland"
    codes: ["2AR9L"]
  - name: "Generalscan"
    codes: ["2ADNT"]

# Data source configuration
data_source:
  # Option 1: spider.cloud — Akamai bypass via managed proxy/rendering infra
  # Set SPIDERCLOUD_API_KEY in environment.  Get a key at https://spider.cloud
  spidercloud:
    enabled: true
    api_key: "${SPIDERCLOUD_API_KEY}"
    base_url: "https://api.spider.cloud"
    stealth: true          # JS fingerprint randomisation (defeats Akamai TLS fingerprint checks)
    proxy_enabled: true    # Route through spider.cloud residential proxy pool
    render_js: true        # Full JS execution before returning HTML
    timeout: 60.0          # seconds per request
    max_retries: 3         # retry on 429 / 503

  # Option 2: FCC EAS Direct (fallback)
  fcc:
    enabled: false

# Notification settings
telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"

# Scheduler settings
scheduler:
  timezone: "UTC"
  run_time: "14:00"

# Database settings
database:
  path: "data/fcc_monitor.db"
  since_date: "2023-01-01"  # Ignore records before this date

# Logging
logging:
  level: "INFO"
  file: "logs/fcc_monitor.log"
